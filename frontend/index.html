<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TalentBay — AI-powered applicant tracking system for modern recruiting teams. Automate workflows, match candidates, and track your pipeline in real time." />
    <meta name="theme-color" content="#3d6347" />
    <meta property="og:title" content="TalentBay — Applicant Tracking System" />
    <meta property="og:description" content="Automate screening workflows, match candidates with AI, and track your pipeline in real time." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>TalentBay — Applicant Tracking System</title>
    <script>
      // Applied before React mounts so there's no light-mode flash on load.
      (function () {
        var stored = localStorage.getItem('ats_theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
